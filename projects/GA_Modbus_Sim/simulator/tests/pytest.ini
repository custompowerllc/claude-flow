[tool:pytest]
# Pytest configuration for Modbus BMS Simulator tests

# Test discovery
testpaths = 
    unit
    integration

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end functionality
    slow: Tests that take a long time to run
    serial: Tests that require serial port hardware
    performance: Performance and stress tests
    mock: Tests using mocks instead of real hardware

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Coverage options (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# Minimum Python version
minversion = 3.7

# Test timeout (if pytest-timeout is installed)  
timeout = 300

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto